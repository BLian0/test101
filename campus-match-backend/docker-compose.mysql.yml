services:
  mysql:
    image: mysql:8.4
    container_name: campus-match-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: campus_match
      MYSQL_USER: campus_match
      MYSQL_PASSWORD: campus_match_dev
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/mysql/init:/docker-entrypoint-initdb.d:ro

volumes:
  mysql_data:
